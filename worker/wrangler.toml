#:schema node_modules/wrangler/config-schema.json
# Reavailable speech server on Cloudflare Workers.
#
# Deploy from CI (see .github/workflows/deploy-cloudflare.yml) or by hand:
#   cd worker && npx wrangler d1 create reavailable-audiobooks   # once, then paste the id below
#   (KV namespace and D1 are created once; see docs)
#   npx wrangler secret put AZURE_SPEECH_KEY                     # once
#   npx wrangler secret put API_KEY                              # once
#   npx wrangler deploy
#
# The deploy workflow replaces D1_DATABASE_ID automatically, so the placeholder below is fine.

name = "reavailable-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "ebcc9b4f989feea5bbdee1181f20b61c"

# Applied to the remote database by `wrangler deploy` (and by `wrangler d1 migrations apply`).
[[d1_databases]]
binding = "DB"
database_name = "reavailable-audiobooks"
database_id = "96560435-747f-4833-abc9-72eb9f1a12d2"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "AUDIO"
id = "c3e8ae5258184414a6d28012d7c94242"

[vars]
AZURE_SPEECH_REGION = "eastus"
AZURE_OUTPUT_FORMAT = "audio-24khz-48kbitrate-mono-mp3"
ALLOWED_VOICES = "uz-UZ-MadinaNeural,uz-UZ-SardorNeural"
DEFAULT_VOICE = "uz-UZ-MadinaNeural"
VERSION = "0.2.0"
MAX_TRANSCRIPT_CHARS = "200000"
MAX_CHUNK_CHARS = "600"
MAX_CHUNKS_PER_JOB = "2000"
JOB_TTL_HOURS = "24"
# A synthesis pass does at most this many parts, then the app's next status poll continues it.
# Raise this on a Workers Paid plan (30 s of CPU per request instead of 10 ms).
CHUNKS_PER_PASS = "8"
TTS_CONCURRENCY = "3"
PASS_BUDGET_MS = "20000"

[triggers]
# Daily retention sweep: drop expired jobs and orphaned audio.
crons = ["17 3 * * *"]

[observability]
enabled = true
