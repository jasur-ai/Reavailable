name: Android test build

# Builds an installable Android APK on a GitHub-hosted runner.
#   - Runs automatically when a push changes mobile/ or this workflow file.
#   - Runs manually from Actions > "Android test build" > Run workflow (only after this file is on
#     the default branch, which is how GitHub lists manual workflows).
# The APK is attached to the run as an artifact. If publish_release is set, it is also attached
# to a GitHub pre-release.
#
# The APK is signed with the Expo debug keystore (the default for release builds in a prebuild
# project). It is suitable for sideloading and testing, not for the Play Store.

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish the APK as a GitHub pre-release"
        type: boolean
        default: false
      release_tag:
        description: "Tag for the pre-release, for example android-test-1 (leave empty for a generated tag)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Download the English voice model
        working-directory: mobile
        run: bash scripts/fetch-vosk-model.sh
        env:
          VOSK_MODEL_SHA256: ${{ vars.VOSK_MODEL_SHA256 }}

      - name: Generate the Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: "1"

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Check the APK contents
        working-directory: mobile
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$apk"
          unzip -l "$apk" > apk-contents.txt
          for required in classes.dex assets/model-en-us/am/final.mdl META-INF/; do
            if ! grep -q "$required" apk-contents.txt; then
              echo "error: '$required' is missing from the APK" >&2
              exit 1
            fi
          done
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          tool=$(find "$sdk/build-tools" -name aapt2 -type f | sort -V | tail -1)
          if [ -z "$tool" ]; then
            tool=$(find "$sdk/build-tools" -name aapt -type f | sort -V | tail -1)
          fi
          "$tool" dump badging "$apk" > badging.txt
          grep "^package:" badging.txt
          grep "uses-permission" badging.txt | sed "s/^/  /"
          for expected in android.permission.RECORD_AUDIO android.permission.INTERNET; do
            if ! grep -q "name='$expected'" badging.txt; then
              echo "error: permission $expected is missing" >&2
              exit 1
            fi
          done
          for unwanted in SYSTEM_ALERT_WINDOW VIBRATE READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE; do
            if grep -q "name='android.permission.$unwanted'" badging.txt; then
              echo "error: unexpected permission $unwanted in the APK" >&2
              exit 1
            fi
          done
          if ! grep -q "^package: name='uz.reavailable.app'" badging.txt; then
            echo "error: unexpected package name" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: reavailable-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish pre-release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reavailable-android-apk
          path: release

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-android-test-${GITHUB_RUN_NUMBER}}"
          cat > notes.md <<'EOF'
          Android test build of Reavailable. The APK is debug-signed, for sideloading and testing, not for the Play Store.

          - Install: copy app-release.apk to the phone, allow installs from the app you open it with, then open the file.
          - Before adding a book, set the backend address in Settings. The app needs a running Reavailable backend.
          - Voice commands use the English model included in the APK.
          - Not yet verified on a physical device. See docs/TESTING.md in the repository.
          EOF
          gh release create "$tag" release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Reavailable $tag (Android test build)" \
            --notes-file notes.md \
            --prerelease
