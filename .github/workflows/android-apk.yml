name: Android test build

# Builds the APK for every branch push that changes the mobile app or the Android workflows, and can
# be started manually (manual start works once these files are on the default branch).
#
# Tag pushes are excluded: android-release.yml builds and publishes those, and a second build of the
# same commit would only spend runner time.

on:
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The deploy workflow commits the server address with "[no apk]" and then pushes a release tag,
    # which builds the same commit through android-release.yml. Building it here too would be a
    # second 10-minute APK build of identical code.
    if: ${{ !contains(github.event.head_commit.message, '[no apk]') }}
    uses: ./.github/workflows/android-build.yml
