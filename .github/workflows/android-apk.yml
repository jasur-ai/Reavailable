name: Android test build

# Builds the APK for every push that changes the mobile app or the Android workflows, and can be
# started manually (manual start works once these files are on the default branch).

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/android-build.yml
