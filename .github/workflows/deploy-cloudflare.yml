name: Deploy speech server (Cloudflare Workers)

# Deploys the Worker in `worker/` to Cloudflare: creates the D1 database and R2 bucket if they are
# missing, applies migrations, stores the Azure Speech key and the app access key as Worker secrets,
# then deploys and checks the live HTTPS address.
#
# Run it from the Actions tab -> "Deploy speech server (Cloudflare Workers)" -> "Run workflow".
# It needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  an API token with Workers Scripts, D1 and R2 edit rights
#   AZURE_SPEECH_KEY      Key 1 of your Azure AI Speech resource
#   AUDIOBOOK_API_KEY     the access key you type into the app's Settings
#                         (only needed while require_access_key is true)
#
# After the server answers correctly the workflow records its address in mobile/src/core/config.ts,
# commits that to this branch and pushes a tag, so android-release.yml publishes an APK that opens
# with the server address already filled in. No further action is needed.

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: Worker name (becomes part of the workers.dev address)
        default: reavailable-api
      database:
        description: D1 database name
        default: reavailable-audiobooks
      bucket:
        description: R2 bucket name
        default: reavailable-audiobooks
      azure_region:
        description: Region of the Azure Speech resource, for example eastus
        default: eastus
      chunks_per_pass:
        description: Parts synthesized per background pass (40 is fine on a Workers Paid plan)
        default: '8'
      require_access_key:
        description: >-
          true (recommended): the app must present AUDIOBOOK_API_KEY to create a book. false: anyone
          who knows the address can create books and use your Azure free quota; note that this
          repository is public, so the address is public.
        type: choice
        options: ['true', 'false']
        default: 'true'

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Needed by the last step, which commits the deployed address, pushes the release tag and starts
    # the APK release workflow.
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ebcc9b4f989feea5bbdee1181f20b61c
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AUDIOBOOK_API_KEY: ${{ secrets.AUDIOBOOK_API_KEY }}
      WRANGLER_SEND_METRICS: 'false'
      WORKER_NAME: ${{ inputs.worker_name || 'reavailable-api' }}
      DATABASE: ${{ inputs.database || 'reavailable-audiobooks' }}
      BUCKET: ${{ inputs.bucket || 'reavailable-audiobooks' }}
      AZURE_REGION: ${{ inputs.azure_region || 'eastus' }}
      CHUNKS_PER_PASS: ${{ inputs.chunks_per_pass || '8' }}
      REQUIRE_KEY: ${{ inputs.require_access_key || 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the last step can commit and push to this branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check the required secrets
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${AZURE_SPEECH_KEY:-}" ] || missing="$missing AZURE_SPEECH_KEY"
          if [ "$REQUIRE_KEY" = "true" ]; then
            [ -n "${AUDIOBOOK_API_KEY:-}" ] || missing="$missing AUDIOBOOK_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them in the repository under Settings -> Secrets and variables -> Actions." >&2
            echo "  CLOUDFLARE_API_TOKEN  https://dash.cloudflare.com/profile/api-tokens" >&2
            echo "  AZURE_SPEECH_KEY      Azure portal -> your Speech resource -> Keys and Endpoint -> KEY 1" >&2
            echo "  AUDIOBOOK_API_KEY     any long random string you choose; you type the same value into the app" >&2
            echo "                        (only needed while require_access_key is true)" >&2
            exit 1
          fi
          echo "Required secrets are present (require_access_key=$REQUIRE_KEY)."
          if [ "$REQUIRE_KEY" != "true" ]; then
            echo "::warning::Deploying without an access key: anyone who knows the address can create books and use the Azure free quota."
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check and tests before touching the account
        run: |
          npm run typecheck
          npm test

      - name: Create or find the D1 database
        id: d1
        run: |
          set -euo pipefail
          existing=$(npx wrangler d1 list --json 2>/dev/null \
            | jq -r --arg name "$DATABASE" '.[]? | select(.name == $name) | .uuid' | head -n 1)
          if [ -z "$existing" ]; then
            echo "Creating D1 database '$DATABASE'."
            existing=$(npx wrangler d1 create "$DATABASE" --json \
              | jq -r '.results[0].uuid // .uuid // empty')
          else
            echo "Using existing D1 database '$DATABASE'."
          fi
          if [ -z "$existing" ]; then
            echo "::error::Could not determine the D1 database id."
            exit 1
          fi
          echo "id=$existing" >> "$GITHUB_OUTPUT"

      - name: Point the configuration at that database and worker name
        run: |
          set -euo pipefail
          sed -i "s|^database_id = .*|database_id = \"${{ steps.d1.outputs.id }}\"|" wrangler.toml
          sed -i "s|^database_name = .*|database_name = \"$DATABASE\"|" wrangler.toml
          sed -i "s|^name = \"reavailable-api\"|name = \"$WORKER_NAME\"|" wrangler.toml
          grep -E '^(name|database_name|database_id)' wrangler.toml

      - name: Apply migrations to the remote database
        run: npx wrangler d1 migrations apply "$DATABASE" --remote

      - name: Deploy
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --var AZURE_SPEECH_REGION:"$AZURE_REGION" \
            --var CHUNKS_PER_PASS:"$CHUNKS_PER_PASS" \
            2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Store the Azure Speech key and the app access key
        run: |
          set -euo pipefail
          printf '%s' "$AZURE_SPEECH_KEY" | npx wrangler secret put AZURE_SPEECH_KEY
          if [ "$REQUIRE_KEY" = "true" ]; then
            printf '%s' "$AUDIOBOOK_API_KEY" | npx wrangler secret put API_KEY
          else
            # Remove a key left over from an earlier deploy, or the server would still ask for one.
            npx wrangler secret delete API_KEY || echo "No API_KEY secret to delete."
          fi

      - name: Deploy again with the secrets in place
        id: final
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --var AZURE_SPEECH_REGION:"$AZURE_REGION" \
            --var CHUNKS_PER_PASS:"$CHUNKS_PER_PASS" \
            2>&1 | tee "$RUNNER_TEMP/deploy2.log"
          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" "$RUNNER_TEMP/deploy2.log" \
            | grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' | head -n 1 || true)
          if [ -z "$url" ]; then
            subdomain=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | jq -r '.result.subdomain // empty')
            if [ -n "$subdomain" ]; then
              url="https://${WORKER_NAME}.${subdomain}.workers.dev"
            fi
          fi
          if [ -z "$url" ]; then
            echo "::error::Deployed, but the workers.dev address could not be determined."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Server address: $url"

      - name: Check the deployed server
        run: |
          set -euo pipefail
          url="${{ steps.final.outputs.url }}"
          echo "GET $url/api/v1/health"
          curl -fsS "$url/api/v1/health"
          echo
          echo "GET $url/api/v1/config (with the app access key)"
          config=$(curl -fsS -H "X-API-Key: $AUDIOBOOK_API_KEY" "$url/api/v1/config")
          echo "$config"
          if [ "$REQUIRE_KEY" = "true" ]; then
            expected='.status == "ok" and .provider == "azure" and .requires_api_key == true and .api_key_ok == true'
          else
            expected='.status == "ok" and .provider == "azure" and .requires_api_key == false'
          fi
          echo "$config" | jq -e "$expected" > /dev/null \
            || { echo "::error::The deployed server did not report the expected configuration ($expected)."; exit 1; }

      - name: Record the address in the app and publish a ready-to-use APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="${{ steps.final.outputs.url }}"
          branch="${GITHUB_REF#refs/heads/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sed -i "s|^const BAKED_SERVER_URL = .*|const BAKED_SERVER_URL = '$url';|" mobile/src/core/config.ts
          grep -n "BAKED_SERVER_URL" mobile/src/core/config.ts

          if git diff --quiet -- mobile/src/core/config.ts; then
            echo "The app already points at $url; nothing to publish."
            echo "published=no" >> "$GITHUB_ENV"
            exit 0
          fi

          git add mobile/src/core/config.ts
          # [no apk] stops android-apk.yml from building the same commit twice; the tag below builds
          # and publishes it through android-release.yml.
          git commit -m "Record the deployed server address in the app [no apk]"
          tag="android-v0.2.0-server$GITHUB_RUN_NUMBER"
          git tag -a "$tag" -m "Android build with the deployed server address ($url)"

          # Publishing must never mask a successful deployment, so a push problem is a warning.
          # A tag pushed with GITHUB_TOKEN does not start push-triggered workflows, so the release
          # workflow is dispatched explicitly (workflow_dispatch is allowed for GITHUB_TOKEN).
          if git push origin "HEAD:$branch" && git push origin "$tag" \
            && gh workflow run android-release.yml --ref "$branch" -f tag="$tag"; then
            echo "published=$tag" >> "$GITHUB_ENV"
            echo "Started android-release.yml for $tag: it builds an APK that opens with the address filled in."
          else
            echo "::warning::The server is live at $url, but the address could not be pushed. Enter it in the app under Settings -> Server address."
            echo "published=no" >> "$GITHUB_ENV"
          fi

      - name: Write the result to the job summary
        run: |
          {
            echo "## Speech server deployed"
            echo
            echo "**Server address:** \`${{ steps.final.outputs.url }}\`"
            echo
            if [ "${published:-no}" = "no" ]; then
              echo "The app already knew this address. Enter it under **Settings -> Server address** if"
              echo "you are using an older build."
            else
              echo "**Ready-to-use APK:** release \`${published}\` is being built now with this address"
              echo "already filled in. Install it from the"
              echo "[releases page](https://github.com/$GITHUB_REPOSITORY/releases) when the build ends."
            fi
            echo
            if [ "$REQUIRE_KEY" = "true" ]; then
              echo "In the app, enter the value of the \`AUDIOBOOK_API_KEY\` secret under **Access key**."
              echo "That key is never written to this summary or to any log."
            else
              echo "**Warning:** this server has **no access key**, so anyone who knows the address can"
              echo "create books and use your Azure free quota. Re-run with \`require_access_key: true\`"
              echo "to close it."
            fi
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Region | $AZURE_REGION |"
            echo "| D1 database | $DATABASE (\`${{ steps.d1.outputs.id }}\`) |"
            echo "| Audio storage | Workers KV (binding AUDIO) |"
            echo "| Parts per background pass | $CHUNKS_PER_PASS |"
            echo "| Access key required | $REQUIRE_KEY |"
          } >> "$GITHUB_STEP_SUMMARY"
