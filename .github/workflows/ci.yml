name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and format
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type check
        run: mypy

      - name: Tests with coverage
        run: pytest -q --cov=app

  mobile:
    name: Mobile (types, lint, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check, lint and unit tests
        run: npm run check

  end-to-end:
    name: End-to-end (live backend, fake speech)
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    env:
      AUDIOBOOK_TTS_PROVIDER: fake
      AUDIOBOOK_ENVIRONMENT: development
      E2E_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e .

      - name: Start backend
        working-directory: backend
        env:
          AUDIOBOOK_DATA_DIR: ${{ runner.temp }}/audiobook-data
        run: |
          set -euo pipefail
          python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy:" >&2
          cat "$RUNNER_TEMP/backend.log" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run end-to-end tests
        working-directory: mobile
        run: npm run test:e2e

      - name: Show backend log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log" || true

  container:
    name: Backend container (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag reavailable-backend:ci backend

      - name: Refuse to start in production without credentials
        run: |
          set +e
          docker run --rm reavailable-backend:ci > startup.log 2>&1
          code=$?
          set -e
          cat startup.log
          if [ "$code" -eq 0 ]; then
            echo "error: the image started without an API key and speech settings" >&2
            exit 1
          fi

      - name: Start in development mode with the fake speech provider
        run: |
          docker run --detach --name api --publish 8000:8000 \
            --env AUDIOBOOK_ENVIRONMENT=development reavailable-backend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Check the smoke-test behaviour
        run: |
          set -euo pipefail
          test "$(docker exec api id -u)" = "10001"
          status=$(curl -s -o create.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"title":"Smoke test","transcript":"Salom dunyo. Bu qisqa sinov matni."}' \
            http://127.0.0.1:8000/api/v1/jobs)
          echo "POST /api/v1/jobs -> $status"
          test "$status" = "202"
          grep -q access_token create.json

      - name: Start in production mode with the documented settings
        run: |
          docker run --detach --name api-prod --publish 8001:8000 \
            --env AUDIOBOOK_API_KEY=ci-only-api-key \
            --env AUDIOBOOK_TTS_PROVIDER=azure \
            --env AUDIOBOOK_AZURE_SPEECH_KEY=ci-placeholder-key \
            --env AUDIOBOOK_AZURE_SPEECH_REGION=westeurope \
            reavailable-backend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/api/v1/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs api-prod
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs api || true
          docker logs api-prod || true

      - name: Remove the production check container
        if: always()
        run: docker rm --force api-prod || true

      - name: Remove the container
        if: always()
        run: docker rm --force api || true
