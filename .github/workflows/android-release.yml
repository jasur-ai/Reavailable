name: Android release

# Publishes a GitHub pre-release with the APK when a tag named android-v* is pushed, for example:
#   git tag android-v0.1.0-test1 && git push origin android-v0.1.0-test1
# The pre-release carries app-release.apk and its SHA-256 checksum.

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/android-build.yml

  publish:
    name: Publish pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reavailable-android-apk
          path: release

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256
          cat > notes.md <<'EOF'
          Android test build of Reavailable.

          - The APK is debug-signed. It is for sideloading and testing, not for the Play Store.
          - Install: download app-release.apk, check it against app-release.apk.sha256, allow installs for the app you open it with, then open the file.
          - Set the server address in Settings. The release app connects only over HTTPS.
          - Voice commands use the English model included in the APK.
          - Not yet tested on a physical phone. See docs/TESTING.md in the repository.
          EOF
          gh release create "$TAG" app-release.apk app-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Reavailable $TAG (Android test build)" \
            --notes-file notes.md \
            --prerelease
