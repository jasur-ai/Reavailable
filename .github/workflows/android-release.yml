name: Android release

# Publishes a GitHub pre-release with the APK when a tag named android-v* is pushed, for example:
#   git tag android-v0.2.0-test1 && git push origin android-v0.2.0-test1
# The pre-release carries app-release.apk and its SHA-256 checksum.
#
# Set the repository variable DEFAULT_SERVER_URL (Settings -> Secrets and variables -> Actions ->
# Variables) to the deployed speech server address, and the published APK starts with that address
# already filled in. Without it the app asks for the address on first launch.

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/android-build.yml
    with:
      default_server_url: ${{ vars.DEFAULT_SERVER_URL }}

  publish:
    name: Publish pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reavailable-android-apk
          path: release

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256
          cat > notes.md <<'EOF'
          Android test build of Reavailable: an offline audiobook reader for Uzbek text.

          - The interface opens in Uzbek. English is a switch under Settings -> Interface language.
          - The APK is debug-signed. It is for sideloading and testing, not for the Play Store.
          - Install: download app-release.apk, check it against app-release.apk.sha256, allow installs for the app you open it with, then open the file.
          - You need a running Reavailable server. Deploy it with the "Deploy speech server (Cloudflare Workers)" workflow, then enter the address and the access key under Settings. The release app connects only over HTTPS.
          - Voice commands are English only: next, repeat, pause, resume. They run on the phone with the model inside this APK and work offline.
          - Step-by-step instructions in Uzbek: docs/UZ_INSTALL.md in the repository.
          - Not yet installed or tested on a physical phone. What is and is not verified: docs/TESTING.md.
          EOF
          gh release create "$TAG" app-release.apk app-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Reavailable $TAG (Android test build)" \
            --notes-file notes.md \
            --prerelease
